<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ titulo }} - Zoro Fan Page</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('inicio') }}">
        <img src="{{ url_for('static', filename='img/zoro-logo.png') }}" class="logo-nav" alt="Logo do Zoro">
        Zoro Fan Page
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuZoro">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuZoro">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('inicio') }}">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('sobre') }}">Sobre</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('espadas') }}">Espadas</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('galeria') }}">Galeria</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    {% block conteudo %}{% endblock %}
  </main>

  <footer class="bg-dark text-white text-center py-4 mt-5">
    <div class="container">
      <p class="mb-1">Lennon Moraes</p>
      <small>Atividade 3 - Flask na AWS</small>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
